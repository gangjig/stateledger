[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stateledger"
version = "0.1.0"
description = "Explicit-state memory for long-running agents: append-only evidence kept separate from conclusions with provenance, confidence, and a lifecycle"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Gang Ji" },
]
keywords = ["agents", "llm", "memory", "state", "provenance", "longharness"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/gangjig/stateledger"
Repository = "https://github.com/gangjig/stateledger"

[tool.setuptools]
packages = ["stateledger"]
